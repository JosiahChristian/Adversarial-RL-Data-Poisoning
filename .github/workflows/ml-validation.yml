name: Research code validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-research-code:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile experiment programs
        run: python -m compileall -q experiments
      - name: Verify research-critical files
        run: |
          test -f experiments/baseline_reward_poisoning.py
          test -f experiments/reward_poisoning_strength_sweep.py
          test -f research/evidence_ledger.md
          test -f research/failure_modes_and_controls.md
          test -f research/thesis_contribution_map.md
          test -f results/baseline_reward_poisoning_summary.json
          test -f results/reward_poisoning_strength_sweep_summary.json
      - name: Validate tracked JSON evidence
        run: |
          python -m json.tool results/baseline_reward_poisoning_summary.json > /dev/null
          python -m json.tool results/reward_poisoning_strength_sweep_summary.json > /dev/null
