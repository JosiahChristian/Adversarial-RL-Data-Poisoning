name: Research baseline

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run deterministic poisoning baseline
        run: python experiments/baseline_reward_poisoning.py
      - name: Verify tracked baseline summary is reproducible
        run: git diff --exit-code -- results/baseline_reward_poisoning_summary.json
      - name: Run held-out poisoning-strength sweep
        run: python experiments/reward_poisoning_strength_sweep.py
      - name: Verify tracked strength-sweep summary is reproducible
        run: git diff --exit-code -- results/reward_poisoning_strength_sweep_summary.json
      - name: Build evidence provenance manifest
        run: |
          {
            echo "commit_sha=${GITHUB_SHA}"
            echo "workflow_run_id=${GITHUB_RUN_ID}"
            echo "workflow_run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "runner_os=${RUNNER_OS}"
            echo "runner_arch=${RUNNER_ARCH}"
            printf "python_version="
            python -VV | tr '\n' ' '
            echo
            printf "platform="
            python -c 'import platform; print(platform.platform())'
            echo
            sha256sum \
              .github/workflows/research-baseline.yml \
              experiments/baseline_reward_poisoning.py \
              experiments/reward_poisoning_strength_sweep.py \
              results/baseline_reward_poisoning.csv \
              results/baseline_reward_poisoning_summary.json \
              results/reward_poisoning_strength_sweep.csv \
              results/reward_poisoning_strength_sweep_summary.json
          } > results/evidence_provenance.txt
      - name: Upload complete research evidence
        uses: actions/upload-artifact@v4
        with:
          name: adversarial-rl-baseline-evidence
          retention-days: 90
          path: |
            results/baseline_reward_poisoning.csv
            results/baseline_reward_poisoning_summary.json
            results/reward_poisoning_strength_sweep.csv
            results/reward_poisoning_strength_sweep_summary.json
            results/evidence_provenance.txt
